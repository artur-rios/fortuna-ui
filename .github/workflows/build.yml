# IR-20: build every target and publish the artifacts.
#
# Runs on a tag and on demand rather than on every push: four platform builds
# are slow, and the merge gate is ci.yml.
#
# The desktop jobs build the client only. The packaging of IR-21 — the installer
# and the portable archive, which also carry the Fortuna core library and the
# SQLite database file — waits on that library existing
# (artur-rios/fortuna-api#156).

name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build
        run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: fortuna-ui-web
          path: build/web

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: fortuna-ui-android
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build
        run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: fortuna-ui-windows
          path: build/windows/x64/runner/Release

  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install the Linux desktop toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev
      - run: flutter pub get
      - name: Build
        run: flutter build linux --release
      - uses: actions/upload-artifact@v4
        with:
          name: fortuna-ui-linux
          path: build/linux/x64/release/bundle
