# IR-11, IR-12: generated code stays generated.
#
# Regenerates the API client and the FFI bindings and compares both with what is
# committed, and diffs the vendored C header against the copy the API publishes.
# Any difference fails the build — which is what makes "never hand-edit the
# generated code" an enforced rule rather than a request (UC-02 AF-04, AF-05).

name: Check generated

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: check-generated-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-client-drift:
    name: API client matches api/fortuna.json
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Regenerate the API client
        run: dart run tool/generate_api_client.dart

      - name: Fail on drift
        run: |
          if ! git diff --quiet -- packages/fortuna_api_client api; then
            echo "::error::The committed API client differs from what regeneration produces."
            echo "Run 'dart run tool/generate_api_client.dart' and commit the result."
            echo "Never hand-edit packages/fortuna_api_client/lib (IR-09, BR-36)."
            git diff --stat -- packages/fortuna_api_client api
            exit 1
          fi
          echo "API client is in sync with api/fortuna.json."

  header-drift:
    name: Vendored C header matches the one the API publishes
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          path: fortuna-ui

      - name: Check out the API
        uses: actions/checkout@v4
        with:
          repository: artur-rios/fortuna-api
          path: fortuna-api

      # UC-02 AF-04: the vendored copy and the published one must be identical.
      # The "neither exists" branch below is a guard for a repository state that
      # no longer occurs, kept so the job explains itself rather than failing
      # obscurely if the header were ever removed upstream.
      - name: Diff the header
        run: |
          VENDORED=fortuna-ui/native/include/fortuna_core.h
          PUBLISHED=$(find fortuna-api -name 'fortuna_core.h' -print -quit)

          if [ ! -f "$VENDORED" ] && [ -z "$PUBLISHED" ]; then
            echo "::notice::No C header on either side — nothing to diff."
            exit 0
          fi

          if [ ! -f "$VENDORED" ]; then
            echo "::error::The API publishes a C header but this repository has not vendored it."
            echo "Copy $PUBLISHED to $VENDORED and run 'dart run tool/generate_bindings.dart'."
            exit 1
          fi

          if [ -z "$PUBLISHED" ]; then
            echo "::error::A header is vendored here but the API publishes none."
            exit 1
          fi

          if ! diff -u "$PUBLISHED" "$VENDORED"; then
            echo "::error::The vendored header differs from the one the API publishes."
            echo "Re-copy it and run 'dart run tool/generate_bindings.dart' (IR-10, IR-11)."
            exit 1
          fi
          echo "Vendored header matches the published one."

  bindings-drift:
    name: FFI bindings match the vendored header
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # AF-05. The bindings and the route table are both derived from the
      # vendored header, so regenerating them must be a no-op on a clean tree.
      # A difference means somebody edited generated code by hand, which is
      # exactly what BR-36 forbids.
      - name: Regenerate the bindings
        run: dart run tool/generate_bindings.dart

      - name: Fail on drift
        run: |
          if ! git diff --quiet -- lib/core/bindings; then
            echo "::error::The committed FFI bindings differ from what regeneration produces."
            echo "Run 'dart run tool/generate_bindings.dart' and commit the result."
            echo "Never hand-edit lib/core/bindings (IR-10, FR-DA-05, BR-36)."
            git diff --stat -- lib/core/bindings
            exit 1
          fi
          echo "FFI bindings are in sync with native/include/fortuna_core.h."
