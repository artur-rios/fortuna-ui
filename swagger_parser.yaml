# IR-09: the API client is generated from the contract the API publishes, and
# committed unmodified. `api/fortuna.json` is copied from fortuna-api, where it
# is produced by that project's own build — it is never authored here, and a
# change to it is the deliberate act of taking a new API version.
#
# Regenerate with:
#   dart run tool/generate_api_client.dart
#
# Everything under packages/fortuna_api_client/lib is generated and is never
# hand-edited (BR-36). The package's own pubspec.yaml is maintained by hand.
# Ergonomic wrappers belong in the consuming feature's data/ layer.
#
# swagger_parser 2 always emits one entry point (`api.dart`, re-exporting
# `exports.dart`) and one folder per tag, each client named after the area it
# serves, so the 1.x layout settings (`name`, `put_clients_in_folder`,
# `squash_clients`, `root_client`, `export_file`, `enums_to_json`,
# `enums_prefix`) have no equivalent here.
#
# The contract closes every DTO (`additionalProperties: false`), and the
# generated decoders reject a response carrying a key they do not know. Such a
# response fails like any other malformed answer (UC-02 AF-07); the contract is
# fixed at the API and re-vendored.

swagger_parser:
  schema_path: api/fortuna.json
  output_directory: packages/fortuna_api_client/lib

  generation:
    http_client: retrofit
    serializer: json_serializable

    # The API's enums travel as numbers or strings; a value this build does
    # not know decodes to the enum's Unknown case, which the screens show as
    # unknown rather than failing the whole response.
    unknown_enum_values: preserve

    # Every response is wrapped in the API's DataOutput envelope, so unwrapping
    # is the repository's job in the consuming feature, not the generator's.
    original_http_response: false

    # An optional nullable property is a `({T? value})?` record, so a request
    # can say "set this to null" (`(value: null)`) apart from "leave it out"
    # (`null`). The offline core merges a PUT body into the stored record, so
    # a key left out keeps its old value there: clearing a description, a
    # counterparty or a parent category needs the explicit null the 1.x
    # client always sent.
    use_presence_records: true
